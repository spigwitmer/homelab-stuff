apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: opencode
  namespace: kubevirt
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: homelab
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: opencode-home
      spec:
        pvc:
          storageClassName: longhorn-wffc
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
        source:
          blank: {}
  template:
    metadata:
      labels:
        kubevirt.io/domain: opencode
        app.kubernetes.io/name: opencode
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: containerdisk
              disk: {}
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: home
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu-22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: opencode-userdata
        - name: home
          dataVolume:
            name: opencode-home