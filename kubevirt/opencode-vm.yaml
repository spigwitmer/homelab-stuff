apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: opencode
  namespace: kubevirt
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: homelab
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: opencode-home
      spec:
        storageClassName: longhorn-wffc
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        source:
          blank: {}
  template:
    metadata:
      labels:
        kubevirt.io/domain: opencode
        app.kubernetes.io/name: opencode
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["charmander"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["cubone"]
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: containerdisk
              disk: {}
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: home
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu-22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userDataSecretRef:
              name: opencode-userdata
        - name: home
          dataVolume:
            name: opencode-home