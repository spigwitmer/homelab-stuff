apiVersion: v1
kind: Secret
metadata:
  name: opencode-userdata
  namespace: kubevirt
  labels:
    app.kubernetes.io/name: opencode
type: Opaque
stringData:
  userdata: |
    #cloud-config
    users:
      - name: opencode
        groups: [sudo, adm]
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        lock_passwd: true
        ssh_authorized_keys:
          - ssh-rsa  pat@thinkpat
    package_update: true
    packages:
      - qemu-guest-agent
      - ca-certificates
    timezone: UTC
    runcmd:
      - systemctl enable --now qemu-guest-agent
      - ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
      - curl -fsSL -o /tmp/node_exporter.tar.gz "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-${ARCH}.tar.gz"
      - tar -xzf /tmp/node_exporter.tar.gz -C /tmp
      - install -m 0755 /tmp/node_exporter-1.8.2.linux-${ARCH}/node_exporter /usr/local/bin/node_exporter
      - rm -rf /tmp/node_exporter*
      - useradd --no-create-home --shell /usr/sbin/nologin node_exporter || true
      - |
        cat > /etc/systemd/system/node-exporter.service <<'EOF'
        [Unit]
        Description=Node Exporter
        After=network.target
        [Service]
        User=node_exporter
        ExecStart=/usr/local/bin/node_exporter
        Restart=on-failure
        [Install]
        WantedBy=multi-user.target
        EOF
      - systemctl daemon-reload
      - systemctl enable --now node-exporter