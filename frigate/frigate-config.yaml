# Frigate YAML rendered into the pod at /config/config.yml.
# Replace the camera blocks below with the real RTSP URLs and credentials
# once the cameras are physically installed and reachable at 192.168.4.x.

mqtt:
  enabled: true
  host: mosquitto.security.svc.cluster.local
  port: 1883
  # Username/password come from the mosquitto-credentials Secret;
  # Frigate's chart reads them and template-substitutes here.
  topic_prefix: frigate
  client_id: frigate
  stats_interval: 60

detectors:
  - type: cpu

# Two cameras by default; each block must be filled in.
cameras:
  front_door:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://<user>:<pass>@192.168.4.<front-door-cam>/Streaming/Channels/101
          input_args: -preset ultrafast -tune zerolatency
          roles:
            - detect
            - record
        - path: rtsp://<user>:<pass>@192.168.4.<front-door-cam>/Streaming/Channels/102
          input_args: -preset ultrafast -tune zerolatency
          roles:
            - detect
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy
    detect:
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      retain_days: 7
      events:
        retain_days: 30
        pre_capture: 5
        post_capture: 5
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      retain:
        default: 14
    zones: {}
    motion_mask: []

  back_door:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://<user>:<pass>@192.168.4.<back-door-cam>/Streaming/Channels/101
          input_args: -preset ultrafast -tune zerolatency
          roles:
            - detect
            - record
        - path: rtsp://<user>:<pass>@192.168.4.<back-door-cam>/Streaming/Channels/102
          input_args: -preset ultrafast -tune zerolatency
          roles:
            - detect
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy
    detect:
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      retain_days: 7
      events:
        retain_days: 30
        pre_capture: 5
        post_capture: 5
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      retain:
        default: 14
    zones: {}
    motion_mask: []

birdseye:
  enabled: true
  width: 1280
  height: 720
  quality: 8

# Tracked object classes (person/vehicle/dog are the typical set).
objects:
  track:
    - person
    - vehicle
    - dog

# Audio detection can be added later once it's known which cameras expose AAC.
# audio:
#   enabled: false

# Live view go2rtc: bundled inside Frigate by default in 0.16.
go2rtc:
  streams: {}

# Web-push notifications reachable via the ingress (HTTPS). VAPID keys are
# generated by Frigate on first run and stored in /config.
notifications:
  enabled: true
  max_duration: 0
  cooldown: 60

ui:
  enabled: true
  time_format: 24h
  timezone: America/Los_Angeles
