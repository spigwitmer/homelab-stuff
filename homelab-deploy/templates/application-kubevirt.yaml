apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "homelab-deploy.fullname" . }}-kubevirt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    {{- include "homelab-deploy.labels" . | nindent 4 }}
spec:
  project: default

  source:
    repoURL: https://github.com/spigwitmer/homelab-stuff.git
    targetRevision: HEAD
    path: kubevirt/upstream
    directory:
      include: '{kubevirt-operator.yaml}'

  destination:
    server: "https://kubernetes.default.svc"
    namespace: kubevirt

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true