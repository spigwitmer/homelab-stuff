---
apiVersion: v1
kind: Secret
metadata:
  name: pihole-password
  namespace: pihole-system
type: Opaque
stringData:
  EXTERNAL_DNS_PIHOLE_PASSWORD: {{ required "homelabDeploy.piholeAppPassword missing" .Values.homelabDeploy.piholeAppPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-creds
  namespace: nextcloud
type: Opaque
stringData:
  db-username: {{ required "homelabDeploy.nextcloud.postgresUsername missing" .Values.homelabDeploy.nextcloud.postgresUsername | quote }}
  nextcloud-username: {{ required "homelabDeploy.nextcloud.username missing" .Values.homelabDeploy.nextcloud.username | quote }}
  nextcloud-password: {{ required "homelabDeploy.nextcloud.password missing" .Values.homelabDeploy.nextcloud.password | quote }}
  postgresAdminPassword: {{ required "homelabDeploy.nextcloud.postgresAdminPassword missing" .Values.homelabDeploy.nextcloud.postgresAdminPassword | quote }}
  postgresUserPassword: {{ required "homelabDeploy.nextcloud.postgresUserPassword missing" .Values.homelabDeploy.nextcloud.postgresUserPassword | quote }}
  postgresReplicationPassword: {{ required "homelabDeploy.nextcloud.postgresReplicationPassword missing" .Values.homelabDeploy.nextcloud.postgresReplicationPassword | quote }}
  redis-password: {{ required "homelabDeploy.nextcloud.redisPassword missing" .Values.homelabDeploy.nextcloud.redisPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: contabo-credentials
  namespace: cert-manager
type: Opaque
stringData:
  clientId: {{ required "homelabDeploy.contabo.clientId missing" .Values.homelabDeploy.contabo.clientId | quote }}
  clientSecret: {{ required "homelabDeploy.contabo.clientSecret missing" .Values.homelabDeploy.contabo.clientSecret | quote }}
  username: {{ required "homelabDeploy.contabo.username missing" .Values.homelabDeploy.contabo.username | quote }}
  password: {{ required "homelabDeploy.contabo.password missing" .Values.homelabDeploy.contabo.password | quote }}
---
# Mosquitto credentials consumed by the broker and by Frigate/HA clients.
apiVersion: v1
kind: Secret
metadata:
  name: mqtt-credentials
  namespace: security
type: Opaque
stringData:
  # username/password for the single local MQTT user
  MQTT_USERNAME: {{ required "homelabDeploy.security.mqtt.username missing" .Values.homelabDeploy.security.mqtt.username | quote }}
  MQTT_PASSWORD: {{ required "homelabDeploy.security.mqtt.password missing" .Values.homelabDeploy.security.mqtt.password | quote }}
---
# Frigate admin credentials (consumed by the Frigate UI / API).
apiVersion: v1
kind: Secret
metadata:
  name: frigate-admin
  namespace: security
type: Opaque
stringData:
  FRIGATE_ADMIN_PASSWORD: {{ required "homelabDeploy.security.frigate.adminPassword missing" .Values.homelabDeploy.security.frigate.adminPassword | quote }}
